<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Genuine Undead-Man</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      color: #fff;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #game-container {
      position: relative;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a12;
    }
    #ui {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, transparent 100%);
      pointer-events: none;
      font-size: 16px;
      font-weight: bold;
      text-shadow: 0 0 6px #0ff;
    }
    #ui .score { color: #ff0; }
    #ui .lives { color: #f0f; letter-spacing: 2px; }
    #ui .status { color: #0f0; font-size: 14px; }
    canvas {
      display: block;
      max-width: 100%;
      max-height: calc(100% - 40px);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border: 2px solid #333;
      border-radius: 4px;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.15);
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.82);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      text-align: center;
      padding: 20px;
    }
    #overlay h1 {
      font-size: clamp(28px, 8vw, 48px);
      color: #ff0;
      text-shadow: 0 0 12px #f80, 0 0 24px #f00;
      margin-bottom: 12px;
      letter-spacing: 2px;
    }
    #overlay p {
      font-size: clamp(14px, 3.5vw, 18px);
      color: #ccc;
      max-width: 360px;
      line-height: 1.5;
      margin-bottom: 8px;
    }
    #overlay .hint {
      font-size: 13px;
      color: #888;
      margin-top: 16px;
    }
    #startBtn, #restartBtn {
      margin-top: 20px;
      padding: 14px 36px;
      font-size: 18px;
      font-family: inherit;
      font-weight: bold;
      background: linear-gradient(180deg, #ff0 0%, #fa0 100%);
      color: #000;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 0 #c80, 0 6px 12px rgba(0,0,0,0.4);
      pointer-events: auto;
      transition: transform 0.1s;
    }
    #startBtn:active, #restartBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #c80; }
    #touch-hint {
      position: absolute;
      bottom: 12px;
      left: 0; right: 0;
      text-align: center;
      font-size: 12px;
      color: #555;
      pointer-events: none;
      z-index: 5;
    }
    @media (max-width: 600px) {
      #ui { font-size: 14px; padding: 6px 10px; }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="ui">
      <div class="score">SCORE: <span id="scoreVal">0</span></div>
      <div class="status" id="statusMsg"></div>
      <div class="lives">LIVES: <span id="livesVal">♥♥♥</span></div>
    </div>
    <canvas id="game"></canvas>
    <div id="touch-hint">Desktop: Arrows / WASD &nbsp;|&nbsp; Mobile: Touch to steer</div>
    <div id="overlay">
      <h1>GENUINE UNDEAD-MAN</h1>
      <p>Eat pellets. Grab cherries to power up and chomp the ghosts!</p>
      <p class="hint">6 unique ghosts · 3 lives · Power mode timed</p>
      <button id="startBtn">START GAME</button>
    </div>
  </div>

  <script>
  // ============== EMBEDDED SPRITES ==============
  const SPRITES = {
    pacman: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAATaUlEQVR42tWbbaxlZ1XHf2s9zz7nvt87r512pqXTaUtLKdAWKENAjQENRqxoqn7xAwaDBBMF9QufSmJCJIZojN80QSPGKCaWRo0GIiC1QN/oe5nO[...]
    ghost1: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAPY0lEQVR42u2be6xnV1XHP2vtfc7vce/MvXdmOo++Zii2paASyqTlbUVoRPnHYCUGjUAQjMYoiKGiiaYmGk3UxIjV2KigaIkVTfCFEIGovMKjBAIR[...]
    ghost2: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAMR0lEQVR42u2bf6hl11XHP2vtfc659735+WY686bTmCExTTNDTBydNDidxkhDGttKqJRiURCsECzUYIsilWgrtGoE0VhKQRHBtlKlbaTVDvijWFui[...]
    ghost3: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAANqUlEQVR42u2ba6xm1VnHf89aa+993nPOOWcuzMAwwwDlMpRpQ6faNqJIy82UaJtip1+qSVuJkDQ1DbGFhNRaqyZ8aLAq1tAaTRQbU9GGSlFMMNYi[...]
    ghost4: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAMuUlEQVR42u2abaxl5VXHf2s9z9773LnzcgcHgVroiwjM8FKCvLRMAa0MUEohYkykif1ifOmHKlZNTGxJNFbrh7aa2PpBS2mqSU2a1tgPFg2VIq+t[...]
    ghost5: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAPRElEQVR42u2be6hnV3XHP2vtfc7vcd/zyHtmMhOdxLcSlTaKqcE+FKQVtUpqRbRa6MNaqAhSQUKhtKWFgvhHq62ltFSLaCiU1oJYg5oQKdaIhpiZ[...]
    ghost6: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAMaUlEQVR42u2bf4xdV3HHPzPn3Pve/vA6jmODgkWcpHFc2wnECY0VidTNj0qYEBcSBWgbmqZq1ahVpRZSUUGrBqRC/+BvqrYSFaIVUhqEWlrRKlAK[...]
  };

  // ============== MAP ==============
  // # wall  . pellet  C cherry  P pac start  space empty
  const MAP_RAW = [
    "###################",
    "#.................#",
    "#.#.###########.#.#",
    "#C...............C#",
    "#.#.###.....###.#.#",
    "#.#.#.........#.#.#",
    "#.#.#.###.###.#.#.#",
    "....#.#.....#.#....",
    "#.#.#.###.###.#.#.#",
    "#........P........#",
    "#.#.#.###.###.#.#.#",
    "....#.#.....#.#....",
    "#.#.#.###.###.#.#.#",
    "#.#.#.........#.#.#",
    "#.#.###.....###.#.#",
    "#C...............C#",
    "#.#.###########.#.#",
    "#.................#",
    "###################"
  ];

  const ROWS = MAP_RAW.length;
  const COLS = MAP_RAW[0].length;

  // ============== GAME STATE ==============
  let canvas, ctx;
  let tileSize = 28;
  let scale = 1;
  let images = {};
  let loaded = 0;
  let gameRunning = false;
  let gameOver = false;
  let score = 0;
  let lives = 3;
  let powered = false;
  let powerTimer = 0;
  let powerDuration = 8; // seconds
  let pelletsLeft = 0;
  let level = 1;
  let frame = 0;
  let lastTime = 0;

  // Directions
  const DIRS = {
    up:    { x: 0, y: -1, name: 'up' },
    down:  { x: 0, y: 1, name: 'down' },
    left:  { x: -1, y: 0, name: 'left' },
    right: { x: 1, y: 0, name: 'right' }
  };
  const DIR_LIST = ['up', 'left', 'down', 'right']; // classic priority-ish

  // Pacman
  let pac = {
    x: 0, y: 0,
    dir: DIRS.left,
    nextDir: DIRS.left,
    speed: 4.2, // tiles per second
    radius: 0.42
  };

  // Ghosts
  let ghosts = [];
  const GHOST_COLORS = ['#f00', '#0ff', '#f0f', '#fa0', '#0f0', '#a0f'];

  // Map data (0 wall, 1 pellet, 2 cherry, 3 empty)
  let map = [];
  let ghostStarts = [];
  let pacStart = { x: 9, y: 9 };

  // ============== INIT MAP ==============
  function buildMap() {
    map = [];
    pelletsLeft = 0;
    ghostStarts = [];
    for (let r = 0; r < ROWS; r++) {
      map[r] = [];
      for (let c = 0; c < COLS; c++) {
        const ch = MAP_RAW[r][c];
        if (ch === '#') {
          map[r][c] = 0;
        } else if (ch === '.') {
          map[r][c] = 1;
          pelletsLeft++;
        } else if (ch === 'C') {
          map[r][c] = 2;
          pelletsLeft++; // count as collectible
        } else if (ch === 'P') {
          map[r][c] = 3;
          pacStart = { x: c + 0.5, y: r + 0.5 };
        } else {
          map[r][c] = 3;
        }
      }
    }
    // Ghost start positions (scattered, all open tiles)
    ghostStarts = [
      { x: 1.5, y: 1.5 },
      { x: 17.5, y: 1.5 },
      { x: 1.5, y: 17.5 },
      { x: 17.5, y: 17.5 },
      { x: 9.5, y: 5.5 },
      { x: 9.5, y: 13.5 }
    ];
  }

  // ============== ENTITIES ==============
  function resetPositions() {
    pac.x = pacStart.x;
    pac.y = pacStart.y;
    pac.dir = DIRS.left;
    pac.nextDir = DIRS.left;

    ghosts = [];
    const imgs = ['ghost1','ghost2','ghost3','ghost4','ghost5','ghost6'];
    for (let i = 0; i < 6; i++) {
      const s = ghostStarts[i];
      ghosts.push({
        x: s.x,
        y: s.y,
        dir: DIRS[DIR_LIST[i % 4]],
        speed: 3.4 + (i % 3) * 0.15,
        baseSpeed: 3.4 + (i % 3) * 0.15,
        imgKey: imgs[i],
        state: 'normal', // normal | frightened | eaten
        eatenTimer: 0,
        id: i
      });
    }
  }

  function resetGame() {
    score = 0;
    lives = 3;
    level = 1;
    powered = false;
    powerTimer = 0;
    gameOver = false;
    buildMap();
    resetPositions();
    updateUI();
    document.getElementById('statusMsg').textContent = '';
  }

  // ============== COLLISION / MOVEMENT HELPERS ==============
  function isWall(tx, ty) {
    let c = Math.floor(tx);
    const r = Math.floor(ty);
    if (r < 0 || r >= ROWS) return true;
    // Horizontal wrap-around (tunnels)
    if (c < 0) c = COLS - 1;
    else if (c >= COLS) c = 0;
    return map[r][c] === 0;
  }

  function canMove(x, y, dir, radius = 0.35) {
    // Simple forward check + slight side tolerance for grid movement
    const look = 0.45;
    const nx = x + dir.x * look;
    const ny = y + dir.y * look;
    // Check center and two side points
    if (isWall(nx, ny)) return false;
    if (dir.x !== 0) { // horizontal move, check y sides
      if (isWall(nx, ny - radius * 0.8) || isWall(nx, ny + radius * 0.8)) return false;
    } else { // vertical
      if (isWall(nx - radius * 0.8, ny) || isWall(nx + radius * 0.8, ny)) return false;
    }
    return true;
  }

  function atTileCenter(ent, tol = 0.12) {
    const cx = Math.floor(ent.x) + 0.5;
    const cy = Math.floor(ent.y) + 0.5;
    return Math.abs(ent.x - cx) < tol && Math.abs(ent.y - cy) < tol;
  }

  function snapToCenter(ent) {
    ent.x = Math.floor(ent.x) + 0.5;
    ent.y = Math.floor(ent.y) + 0.5;
  }

  // ============== GHOST AI ==============
  function chooseGhostDir(g) {
    if (g.state === 'eaten') {
      // Head home (center-ish)
      const target = { x: 9.5, y: 9.5 };
      return greedyDir(g, target, true);
    }
    if (g.state === 'frightened') {
      // Random-ish flee
      return randomValidDir(g);
    }
    // Chase Pacman with some personality
    const target = { x: pac.x, y: pac.y };
    // Slight offset for variety
    if (g.id % 2 === 1) {
      target.x += g.dir.x * 2;
      target.y += g.dir.y * 2;
    }
    return greedyDir(g, target, false);
  }

  function greedyDir(g, target, allowReverse) {
    const options = [];
    for (const name of DIR_LIST) {
      const d = DIRS[name];
      if (!allowReverse && d.x === -g.dir.x && d.y === -g.dir.y) continue;
      if (canMove(g.x, g.y, d, 0.35)) {
        const dist = Math.hypot((g.x + d.x) - target.x, (g.y + d.y) - target.y);
        options.push({ dir: d, dist });
      }
    }
    if (options.length === 0) {
      // Must reverse - return proper DIRS object reference
      return DIRS[g.dir.x === 0 ? (g.dir.y > 0 ? 'up' : 'down') : (g.dir.x > 0 ? 'left' : 'right')];
    }
    options.sort((a, b) => a.dist - b.dist);
    // Occasionally pick 2nd best for unpredictability
    if (options.length > 1 && Math.random() < 0.18) {
      return options[1].dir;
    }
    return options[0].dir;
  }

  function randomValidDir(g) {
    const valid = [];
    for (const name of DIR_LIST) {
      const d = DIRS[name];
      if (d.x === -g.dir.x && d.y === -g.dir.y) continue;
      if (canMove(g.x, g.y, d, 0.35)) valid.push(d);
    }
    if (valid.length === 0) return DIRS[g.dir.x === 0 ? (g.dir.y > 0 ? 'up' : 'down') : (g.dir.x > 0 ? 'left' : 'right')];
    return valid[Math.floor(Math.random() * valid.length)];
  }

  // ============== UPDATE ==============
  function update(dt) {
    if (!gameRunning || gameOver) return;
    frame++;

    // Power timer
    if (powered) {
      powerTimer -= dt;
      if (powerTimer <= 0) {
        powered = false;
        powerTimer = 0;
        for (const g of ghosts) {
          if (g.state === 'frightened') g.state = 'normal';
        }
        document.getElementById('statusMsg').textContent = '';
      } else {
        document.getElementById('statusMsg').textContent = 'POWER! ' + Math.ceil(powerTimer) + 's';
      }
    }

    // --- Pacman movement ---
    // Try to turn to nextDir when possible
    if (pac.nextDir && (pac.nextDir.x !== pac.dir.x || pac.nextDir.y !== pac.dir.y)) {
      if (canMove(pac.x, pac.y, pac.nextDir, pac.radius)) {
        // Snap if near center for clean turns
        if (atTileCenter(pac, 0.25)) {
          snapToCenter(pac);
          pac.dir = pac.nextDir;
        } else if (canMove(pac.x, pac.y, pac.nextDir, pac.radius * 0.9)) {
          pac.dir = pac.nextDir;
        }
      }
    }
    // FIX #1: Always attempt movement in current direction, don't stop on failed turn
    // Move in CURRENT direction (always checked if possible)
    if (canMove(pac.x, pac.y, pac.dir, pac.radius)) {
      pac.x += pac.dir.x * pac.speed * dt;
      pac.y += pac.dir.y * pac.speed * dt;
    } else {
      // Only snap if at tile center, but don't stop momentum
      if (atTileCenter(pac, 0.25)) snapToCenter(pac);
    }
    // Wrap horizontal tunnels
    if (pac.x < 0) pac.x += COLS;
    else if (pac.x >= COLS) pac.x -= COLS;

    // Eat pellets / cherries
    const pc = Math.floor(pac.x);
    const pr = Math.floor(pac.y);
    if (pr >= 0 && pr < ROWS && pc >= 0 && pc < COLS) {
      const cell = map[pr][pc];
      if (cell === 1) {
        map[pr][pc] = 3;
        score += 10;
        pelletsLeft--;
        updateUI();
      } else if (cell === 2) {
        map[pr][pc] = 3;
        score += 50;
        pelletsLeft--;
        // Activate power
        powered = true;
        powerTimer = powerDuration;
        for (const g of ghosts) {
          if (g.state !== 'eaten') {
            g.state = 'frightened';
            // Reverse direction
            g.dir = { x: -g.dir.x, y: -g.dir.y };
          }
        }
        updateUI();
      }
    }

    // Win check - clear board and advance to next
    if (pelletsLeft <= 0) {
      score += 500 * level;
      level++;
      // Reset pellets for next board, keep score/lives, ghosts reset
      buildMap();
      resetPositions();
      powered = false;
      powerTimer = 0;
      document.getElementById('statusMsg').textContent = 'LEVEL ' + level + '! +' + (500*(level-1));
      setTimeout(() => { if (gameRunning) document.getElementById('statusMsg').textContent = ''; }, 2500);
      updateUI();
    }

    // --- Ghosts ---
    for (const g of ghosts) {
      // FIX #5: Handle speed updates in correct order
      if (g.state === 'eaten') {
        g.eatenTimer -= dt;
        g.speed = 6;
        if (g.eatenTimer <= 0) {
          g.state = powered ? 'frightened' : 'normal';
          g.speed = g.baseSpeed;
          // Respawn near center
          g.x = 9.5;
          g.y = 9.5;
        }
      } else {
        // Speed logic for non-eaten ghosts
        if (g.state === 'frightened') {
          g.speed = g.baseSpeed * 0.55;
        } else {
          g.speed = g.baseSpeed;
        }
      }

      // Decide new direction near tile centers or if blocked
      const nearCenter = atTileCenter(g, 0.22);
      if (nearCenter) {
        snapToCenter(g);
        g.dir = chooseGhostDir(g);
      }

      if (canMove(g.x, g.y, g.dir, 0.32)) {
        g.x += g.dir.x * g.speed * dt;
        g.y += g.dir.y * g.speed * dt;
      } else {
        // Blocked - force rechoose (even if not centered)
        g.dir = chooseGhostDir(g);
        // Try the new dir immediately
        if (canMove(g.x, g.y, g.dir, 0.32)) {
          g.x += g.dir.x * g.speed * dt;
          g.y += g.dir.y * g.speed * dt;
        }
      }
      // Wrap horizontal tunnels
      if (g.x < 0) g.x += COLS;
      else if (g.x >= COLS) g.x -= COLS;

      // FIX #4: Collision radius reduced from 0.7 to 0.5 for better gameplay
      const dist = Math.hypot(g.x - pac.x, g.y - pac.y);
      if (dist < 0.5) {
        if (g.state === 'frightened') {
          // Eat ghost
          g.state = 'eaten';
          g.eatenTimer = 4;
          score += 200;
          updateUI();
        } else if (g.state === 'normal') {
          // Die
          lives--;
          updateUI();
          if (lives <= 0) {
            gameOver = true;
            gameRunning = false;
            showGameOver();
          } else {
            // Reset positions, brief pause feel
            resetPositions();
            powered = false;
            powerTimer = 0;
            document.getElementById('statusMsg').textContent = 'LIFE LOST!';
            setTimeout(() => {
              if (gameRunning) document.getElementById('statusMsg').textContent = '';
            }, 1500);
          }
        }
      }
    }
  }

  // ============== DRAW ==============
  function draw() {
    if (!ctx) return;
    const w = canvas.width;
    const h = canvas.height;
    ctx.fillStyle = '#000010';
    ctx.fillRect(0, 0, w, h);

    // Draw maze
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const x = c * tileSize;
        const y = r * tileSize;
        if (map[r][c] === 0) {
          // Wall - neon style
          ctx.fillStyle = '#1a2a4a';
          ctx.fillRect(x, y, tileSize, tileSize);
          ctx.strokeStyle = '#3a6a9a';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(x + 1, y + 1, tileSize - 2, tileSize - 2);
        } else {
          // Path
          ctx.fillStyle = '#0a0a18';
          ctx.fillRect(x, y, tileSize, tileSize);
          if (map[r][c] === 1) {
            // Pellet
            ctx.beginPath();
            ctx.arc(x + tileSize / 2, y + tileSize / 2, tileSize * 0.12, 0, Math.PI * 2);
            ctx.fillStyle = '#ffcc66';
            ctx.fill();
          } else if (map[r][c] === 2) {
            // Cherry (simple pixel cherries)
            drawCherry(x + tileSize / 2, y + tileSize / 2, tileSize * 0.35);
          }
        }
      }
    }

    // Draw ghosts
    for (const g of ghosts) {
      const sx = g.x * tileSize;
      const sy = g.y * tileSize;
      const size = tileSize * 0.95;
      const img = images[g.imgKey];
      if (!img) continue;

      ctx.save();
      if (g.state === 'frightened') {
        // Blue tint + flash near end
        if (powerTimer < 2 && Math.floor(powerTimer * 6) % 2 === 0) {
          ctx.globalAlpha = 0.5;
        } else {
          ctx.filter = 'hue-rotate(180deg) saturate(1.5) brightness(0.85)';
        }
      } else if (g.state === 'eaten') {
        ctx.globalAlpha = 0.35;
      }

      ctx.drawImage(img, sx - size / 2, sy - size / 2, size, size);
      ctx.restore();
      ctx.filter = 'none';
      ctx.globalAlpha = 1;
    }

    // Draw Pacman
    const px = pac.x * tileSize;
    const py = pac.y * tileSize;
    const psize = tileSize * 0.95;
    if (images.pacman) {
      ctx.save();
      // Slight bob when powered
      if (powered) {
        ctx.shadowColor = '#ff0';
        ctx.shadowBlur = 12 + Math.sin(frame * 0.3) * 4;
      }
      ctx.drawImage(images.pacman, px - psize / 2, py - psize / 2, psize, psize);
      ctx.restore();
    }
  }

  function drawCherry(cx, cy, s) {
    // Two cherries + stems
    ctx.fillStyle = '#e22';
    ctx.beginPath();
    ctx.arc(cx - s * 0.3, cy + s * 0.15, s * 0.38, 0, Math.PI * 2);
    ctx.arc(cx + s * 0.3, cy + s * 0.25, s * 0.38, 0, Math.PI * 2);
    ctx.fill();
    // Highlight
    ctx.fillStyle = '#f88';
    ctx.beginPath();
    ctx.arc(cx - s * 0.4, cy + s * 0.05, s * 0.12, 0, Math.PI * 2);
    ctx.fill();
    // Stems
    ctx.strokeStyle = '#3a8';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx - s * 0.3, cy - s * 0.15);
    ctx.quadraticCurveTo(cx, cy - s * 0.6, cx + s * 0.3, cy - s * 0.05);
    ctx.stroke();
  }

  // ============== UI ==============
  function updateUI() {
    document.getElementById('scoreVal').textContent = score;
    const hearts = '♥'.repeat(Math.max(0, lives)) + '♡'.repeat(Math.max(0, 3 - lives));
    document.getElementById('livesVal').textContent = hearts;
  }

  function showGameOver() {
    const ov = document.getElementById('overlay');
    ov.innerHTML = `
      <h1>GAME OVER</h1>
      <p>Final Score: <strong style="color:#ff0">${score}</strong></p>
      <p class="hint">The ghosts got you...</p>
      <button id="restartBtn">PLAY AGAIN</button>
    `;
    ov.style.display = 'flex';
    document.getElementById('restartBtn').addEventListener('click', () => {
      ov.style.display = 'none';
      resetGame();
      gameRunning = true;
      lastTime = performance.now();
      requestAnimationFrame(loop);
    });
  }

  // ============== INPUT ==============
  function setDir(name) {
    if (DIRS[name]) pac.nextDir = DIRS[name];
  }

  window.addEventListener('keydown', e => {
    if (!gameRunning) return;
    const k = e.key.toLowerCase();
    if (k === 'arrowup' || k === 'w') { e.preventDefault(); setDir('up'); }
    else if (k === 'arrowdown' || k === 's') { e.preventDefault(); setDir('down'); }
    else if (k === 'arrowleft' || k === 'a') { e.preventDefault(); setDir('left'); }
    else if (k === 'arrowright' || k === 'd') { e.preventDefault(); setDir('right'); }
  });

  // Touch: direction relative to Pacman
  function handleTouch(e) {
    if (!gameRunning || !canvas) return;
    e.preventDefault();
    const touch = e.touches[0] || e.changedTouches[0];
    if (!touch) return;
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const tx = (touch.clientX - rect.left) * scaleX;
    const ty = (touch.clientY - rect.top) * scaleY;
    // Relative to Pacman center
    const dx = tx - pac.x * tileSize;
    const dy = ty - pac.y * tileSize;
    if (Math.abs(dx) > Math.abs(dy)) {
      setDir(dx > 0 ? 'right' : 'left');
    } else {
      setDir(dy > 0 ? 'down' : 'up');
    }
  }

  // ============== RESIZE ==============
  function resize() {
    const container = document.getElementById('game-container');
    const maxW = container.clientWidth - 16;
    const maxH = container.clientHeight - 50;
    // Prefer fitting the map aspect
    const mapAspect = COLS / ROWS;
    let cw, ch;
    if (maxW / maxH > mapAspect) {
      ch = Math.min(maxH, 640);
      cw = ch * mapAspect;
    } else {
      cw = Math.min(maxW, 700);
      ch = cw / mapAspect;
    }
    tileSize = Math.floor(cw / COLS);
    canvas.width = tileSize * COLS;
    canvas.height = tileSize * ROWS;
    canvas.style.width = canvas.width + 'px';
    canvas.style.height = canvas.height + 'px';
  }

  // ============== LOOP ==============
  function loop(now) {
    if (!gameRunning && !gameOver) return;
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    update(dt);
    draw();
    if (gameRunning) requestAnimationFrame(loop);
  }

  // ============== BOOT ==============
  function loadImages() {
    return new Promise(resolve => {
      const keys = Object.keys(SPRITES);
      let count = 0;
      keys.forEach(key => {
        const img = new Image();
        img.onload = () => {
          count++;
          if (count === keys.length) resolve();
        };
        img.onerror = () => {
          console.warn('Failed', key);
          count++;
          if (count === keys.length) resolve();
        };
        img.src = SPRITES[key];
        images[key] = img;
      });
    });
  }

  async function init() {
    canvas = document.getElementById('game');
    ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    await loadImages();
    buildMap();
    resetPositions();
    resize();
    window.addEventListener('resize', resize);
    updateUI();

    // Touch events
    canvas.addEventListener('touchstart', handleTouch, { passive: false });
    canvas.addEventListener('touchmove', handleTouch, { passive: false });

    document.getElementById('startBtn').addEventListener('click', () => {
      document.getElementById('overlay').style.display = 'none';
      resetGame();
      gameRunning = true;
      lastTime = performance.now();
      requestAnimationFrame(loop);
    });

    // Draw once idle
    draw();
  }

  // Inject real base64 (replaced by build script)
  init();
  </script>
</body>
</html>
