<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Genuine Undead-Man</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      color: #fff;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #game-container {
      position: relative;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      background: #0a0a12;
      padding-top: 36px;
    }
    #ui {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, transparent 100%);
      pointer-events: none;
      font-size: 16px;
      font-weight: bold;
      text-shadow: 0 0 6px #0ff;
    }
    #ui .score { color: #ff0; }
    #ui .lives { color: #f0f; letter-spacing: 2px; }
    #ui .status { color: #0f0; font-size: 14px; }
    canvas {
      display: block;
      max-width: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border: 2px solid #333;
      border-radius: 4px;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.15);
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.82);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      text-align: center;
      padding: 20px;
    }
    #overlay h1 {
      font-size: clamp(28px, 8vw, 48px);
      color: #ff0;
      text-shadow: 0 0 12px #f80, 0 0 24px #f00;
      margin-bottom: 12px;
      letter-spacing: 2px;
    }
    #overlay p {
      font-size: clamp(14px, 3.5vw, 18px);
      color: #ccc;
      max-width: 360px;
      line-height: 1.5;
      margin-bottom: 8px;
    }
    #overlay .hint {
      font-size: 13px;
      color: #888;
      margin-top: 16px;
    }
    #startBtn, #restartBtn {
      margin-top: 20px;
      padding: 14px 36px;
      font-size: 18px;
      font-family: inherit;
      font-weight: bold;
      background: linear-gradient(180deg, #ff0 0%, #fa0 100%);
      color: #000;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 0 #c80, 0 6px 12px rgba(0,0,0,0.4);
      pointer-events: auto;
      transition: transform 0.1s;
    }
    #startBtn:active, #restartBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #c80; }
    
    /* Mobile Controls Styling */
    #mobile-controls {
      display: grid;
      grid-template-columns: repeat(3, 50px);
      grid-template-rows: repeat(2, 50px);
      gap: 6px;
      margin-top: 10px;
      z-index: 15;
    }
    .dpad-btn {
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(0, 255, 255, 0.4);
      border-radius: 10px;
      color: #0ff;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }
    .dpad-btn:active {
      background: rgba(0, 255, 255, 0.4);
      color: #fff;
      transform: scale(0.92);
    }
    #btn-up { grid-column: 2; grid-row: 1; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-down { grid-column: 2; grid-row: 2; }
    #btn-right { grid-column: 3; grid-row: 2; }

    @media (min-width: 768px) {
      #mobile-controls { display: none; }
    }
    @media (max-width: 600px) {
      #ui { font-size: 14px; padding: 6px 10px; }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="ui">
      <div class="score">SCORE: <span id="scoreVal">0</span></div>
      <div class="status" id="statusMsg"></div>
      <div class="lives">LIVES: <span id="livesVal">♥♥♥</span></div>
    </div>
    <canvas id="game"></canvas>
    
    <!-- Directional Controls for Mobile -->
    <div id="mobile-controls">
      <div class="dpad-btn" id="btn-up">▲</div>
      <div class="dpad-btn" id="btn-left">◀</div>
      <div class="dpad-btn" id="btn-down">▼</div>
      <div class="dpad-btn" id="btn-right">▶</div>
    </div>

    <div id="overlay">
      <h1>GENUINE UNDEAD-MAN</h1>
      <p>Eat pellets. Grab cherries to power up and chomp the ghosts!</p>
      <p class="hint">6 unique undead ghosts · 3 lives · Timed power mode</p>
      <button id="startBtn">START GAME</button>
    </div>
  </div>

  <script>
  // All character and background sprite image paths
  const SPRITES = {
    pacman: 'content-removebg-preview.png',
    ghost1: 'content-removebg-preview (1).png',
    ghost2: 'content-removebg-preview (2).png',
    ghost3: 'content-removebg-preview (3).png',
    ghost4: 'content-removebg-preview (4).png',
    ghost5: 'content-removebg-preview (5).png',
    ghost6: 'image-removebg-preview.png',
    bg: 'image_60d23c.jpg'
  };

  const MAP_RAW = [
    "###################",
    "#.................#",
    "#.#.###########.#.#",
    "#C...............C#",
    "#.#.###.....###.#.#",
    "#.#.#.........#.#.#",
    "#.#.#.###.###.#.#.#",
    "....#.#.....#.#....",
    "#.#.#.###.###.#.#.#",
    "#........P........#",
    "#.#.#.###.###.#.#.#",
    "....#.#.....#.#....",
    "#.#.#.###.###.#.#.#",
    "#.#.#.........#.#.#",
    "#.#.###.....###.#.#",
    "#C...............C#",
    "#.#.###########.#.#",
    "#.................#",
    "###################"
  ];

  const ROWS = MAP_RAW.length;
  const COLS = MAP_RAW[0].length;

  let canvas, ctx;
  let tileSize = 28;
  let images = {};
  let gameRunning = false;
  let gameOver = false;
  let score = 0;
  let lives = 3;
  let powered = false;
  let powerTimer = 0;
  let powerDuration = 8;
  let pelletsLeft = 0;
  let level = 1;
  let frame = 0;
  let lastTime = 0;

  const DIRS = {
    up:    { x: 0, y: -1, name: 'up' },
    down:  { x: 0, y: 1, name: 'down' },
    left:  { x: -1, y: 0, name: 'left' },
    right: { x: 1, y: 0, name: 'right' }
  };
  const DIR_LIST = ['up', 'left', 'down', 'right'];

  function reverseDir(d) {
    if (!d) return DIRS.left;
    if (d.x === 0) return d.y > 0 ? DIRS.up : DIRS.down;
    return d.x > 0 ? DIRS.left : DIRS.right;
  }

  let pac = {
    x: 0, y: 0,
    dir: DIRS.left,
    nextDir: DIRS.left,
    speed: 4.2
  };

  let ghosts = [];
  let map = [];
  let ghostStarts = [];
  let pacStart = { x: 9, y: 9 };

  function buildMap() {
    map = [];
    pelletsLeft = 0;
    for (let r = 0; r < ROWS; r++) {
      map[r] = [];
      for (let c = 0; c < COLS; c++) {
        const ch = MAP_RAW[r][c];
        if (ch === '#') {
          map[r][c] = 0;
        } else if (ch === '.') {
          map[r][c] = 1;
          pelletsLeft++;
        } else if (ch === 'C') {
          map[r][c] = 2;
          pelletsLeft++;
        } else if (ch === 'P') {
          map[r][c] = 3;
          pacStart = { x: c + 0.5, y: r + 0.5 };
        } else {
          map[r][c] = 3;
        }
      }
    }
    ghostStarts = [
      { x: 1.5, y: 1.5 },
      { x: 17.5, y: 1.5 },
      { x: 1.5, y: 17.5 },
      { x: 17.5, y: 17.5 },
      { x: 9.5, y: 5.5 },
      { x: 9.5, y: 13.5 }
    ];
  }

  function resetPositions() {
    pac.x = pacStart.x;
    pac.y = pacStart.y;
    pac.dir = DIRS.left;
    pac.nextDir = DIRS.left;

    ghosts = [];
    const imgs = ['ghost1','ghost2','ghost3','ghost4','ghost5','ghost6'];
    for (let i = 0; i < 6; i++) {
      const s = ghostStarts[i];
      let initDir = DIRS.left;
      for (const name of DIR_LIST) {
        const d = DIRS[name];
        if (canPassTile(Math.floor(s.x + d.x), Math.floor(s.y + d.y))) { initDir = d; break; }
      }
      ghosts.push({
        x: s.x,
        y: s.y,
        dir: initDir,
        speed: 3.0 + (i % 3) * 0.25,
        baseSpeed: 3.0 + (i % 3) * 0.25,
        imgKey: imgs[i],
        state: 'normal',
        eatenTimer: 0,
        id: i
      });
    }
  }

  function resetGame() {
    score = 0;
    lives = 3;
    level = 1;
    powered = false;
    powerTimer = 0;
    gameOver = false;
    buildMap();
    resetPositions();
    updateUI();
    document.getElementById('statusMsg').textContent = '';
  }

  function canPassTile(c, r) {
    if (r < 0 || r >= ROWS) return false;
    if (c < 0 || c >= COLS) return true;
    return map[r][c] !== 0;
  }

  function moveEntity(ent, speed, dt) {
    let step = speed * dt;
    
    if (ent.nextDir && (ent.nextDir.x !== ent.dir.x || ent.nextDir.y !== ent.dir.y)) {
      const currentTileX = Math.floor(ent.x);
      const currentTileY = Math.floor(ent.y);
      const targetTileX = currentTileX + ent.nextDir.x;
      const targetTileY = currentTileY + ent.nextDir.y;

      if (canPassTile(targetTileX, targetTileY)) {
        const centerX = currentTileX + 0.5;
        const centerY = currentTileY + 0.5;
        const distToCenter = Math.hypot(ent.x - centerX, ent.y - centerY);
        
        if (distToCenter <= step + 0.1) {
          ent.x = centerX;
          ent.y = centerY;
          ent.dir = ent.nextDir;
        }
      }
    }

    const nextX = ent.x + ent.dir.x * step;
    const nextY = ent.y + ent.dir.y * step;

    if (ent.dir.x !== 0) {
      ent.y = Math.floor(ent.y) + 0.5;
      const checkC = Math.floor(nextX + ent.dir.x * 0.4);
      const checkR = Math.floor(ent.y);
      if (canPassTile(checkC, checkR)) {
        ent.x = nextX;
      } else {
        ent.x = Math.floor(ent.x) + 0.5;
      }
    } else if (ent.dir.y !== 0) {
      ent.x = Math.floor(ent.x) + 0.5;
      const checkC = Math.floor(ent.x);
      const checkR = Math.floor(nextY + ent.dir.y * 0.4);
      if (canPassTile(checkC, checkR)) {
        ent.y = nextY;
      } else {
        ent.y = Math.floor(ent.y) + 0.5;
      }
    }

    if (ent.x < 0) ent.x += COLS;
    else if (ent.x >= COLS) ent.x -= COLS;
  }

  function getGhostChoices(g) {
    const valid = [];
    const currentC = Math.floor(g.x);
    const currentR = Math.floor(g.y);

    for (const name of DIR_LIST) {
      const d = DIRS[name];
      if (d.x === -g.dir.x && d.y === -g.dir.y) continue;
      if (canPassTile(currentC + d.x, currentR + d.y)) {
        valid.push(d);
      }
    }

    if (valid.length === 0) {
      valid.push(reverseDir(g.dir));
    }
    return valid;
  }

  function chooseGhostDir(g) {
    const choices = getGhostChoices(g);
    if (choices.length === 1) return choices[0];

    if (g.state === 'frightened') {
      return choices[Math.floor(Math.random() * choices.length)];
    }

    let target = { x: pac.x, y: pac.y };
    if (g.state === 'eaten') {
      target = ghostStarts[g.id] || { x: 9.5, y: 9.5 };
    }

    let bestDir = choices[0];
    let minDistance = Infinity;

    for (const d of choices) {
      const testX = g.x + d.x;
      const testY = g.y + d.y;
      const dist = Math.hypot(testX - target.x, testY - target.y);
      if (dist < minDistance) {
        minDistance = dist;
        bestDir = d;
      }
    }
    return bestDir;
  }

  function update(dt) {
    if (!gameRunning || gameOver) return;
    frame++;

    if (powered) {
      powerTimer -= dt;
      if (powerTimer <= 0) {
        powered = false;
        powerTimer = 0;
        for (const g of ghosts) {
          if (g.state === 'frightened') g.state = 'normal';
        }
        document.getElementById('statusMsg').textContent = '';
      } else {
        document.getElementById('statusMsg').textContent = 'POWER! ' + Math.ceil(powerTimer) + 's';
      }
    }

    moveEntity(pac, pac.speed, dt);

    const pc = Math.floor(pac.x);
    const pr = Math.floor(pac.y);
    if (pr >= 0 && pr < ROWS && pc >= 0 && pc < COLS) {
      const cell = map[pr][pc];
      if (cell === 1) {
        map[pr][pc] = 3;
        score += 10;
        pelletsLeft--;
        updateUI();
      } else if (cell === 2) {
        map[pr][pc] = 3;
        score += 50;
        pelletsLeft--;
        powered = true;
        powerTimer = powerDuration;
        for (const g of ghosts) {
          if (g.state !== 'eaten') {
            g.state = 'frightened';
            g.dir = reverseDir(g.dir);
          }
        }
        updateUI();
      }
    }

    if (pelletsLeft <= 0) {
      score += 500 * level;
      level++;
      buildMap();
      resetPositions();
      powered = false;
      powerTimer = 0;
      document.getElementById('statusMsg').textContent = 'LEVEL ' + level + '!';
      setTimeout(() => { if (gameRunning) document.getElementById('statusMsg').textContent = ''; }, 2500);
      updateUI();
    }

    for (const g of ghosts) {
      if (g.state === 'eaten') {
        g.speed = 6.0;
        const target = ghostStarts[g.id];
        if (Math.hypot(g.x - target.x, g.y - target.y) < 0.4) {
          g.state = powered ? 'frightened' : 'normal';
          g.speed = g.baseSpeed;
        }
      } else {
        g.speed = g.state === 'frightened' ? g.baseSpeed * 0.55 : g.baseSpeed;
      }

      const centerX = Math.floor(g.x) + 0.5;
      const centerY = Math.floor(g.y) + 0.5;
      if (Math.hypot(g.x - centerX, g.y - centerY) < 0.1) {
        g.nextDir = chooseGhostDir(g);
      }

      moveEntity(g, g.speed, dt);

      const dist = Math.hypot(g.x - pac.x, g.y - pac.y);
      if (dist < 0.5) {
        if (g.state === 'frightened') {
          g.state = 'eaten';
          score += 200;
          updateUI();
        } else if (g.state === 'normal') {
          lives = Math.max(0, lives - 1);
          updateUI();
          if (lives <= 0) {
            gameOver = true;
            gameRunning = false;
            showGameOver();
          } else {
            resetPositions();
            powered = false;
            powerTimer = 0;
            document.getElementById('statusMsg').textContent = 'LIFE LOST!';
            setTimeout(() => {
              if (gameRunning) document.getElementById('statusMsg').textContent = '';
            }, 1500);
          }
        }
      }
    }
  }

  function draw() {
    if (!ctx) return;
    const w = canvas.width;
    const h = canvas.height;
    ctx.fillStyle = '#000010';
    ctx.fillRect(0, 0, w, h);

    if (images.bg) {
      ctx.save();
      ctx.globalAlpha = 0.20;
      const bgAspect = images.bg.width / images.bg.height;
      const canvasAspect = w / h;
      let drawW, drawH, drawX, drawY;

      if (canvasAspect > bgAspect) {
        drawW = w;
        drawH = w / bgAspect;
      } else {
        drawH = h;
        drawW = h * bgAspect;
      }
      drawX = (w - drawW) / 2;
      drawY = (h - drawH) / 2;

      ctx.drawImage(images.bg, drawX, drawY, drawW, drawH);
      ctx.restore();
    }

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const x = c * tileSize;
        const y = r * tileSize;
        if (map[r][c] === 0) {
          ctx.fillStyle = '#1a2a4a';
          ctx.fillRect(x, y, tileSize, tileSize);
          ctx.strokeStyle = '#3a6a9a';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(x + 1, y + 1, tileSize - 2, tileSize - 2);
        } else {
          ctx.fillStyle = 'rgba(10, 10, 24, 0.6)';
          ctx.fillRect(x, y, tileSize, tileSize);
          if (map[r][c] === 1) {
            ctx.beginPath();
            ctx.arc(x + tileSize / 2, y + tileSize / 2, tileSize * 0.12, 0, Math.PI * 2);
            ctx.fillStyle = '#ffcc66';
            ctx.fill();
          } else if (map[r][c] === 2) {
            drawCherry(x + tileSize / 2, y + tileSize / 2, tileSize * 0.35);
          }
        }
      }
    }

    for (const g of ghosts) {
      const sx = g.x * tileSize;
      const sy = g.y * tileSize;
      const size = tileSize * 0.95;
      const img = images[g.imgKey];
      if (!img) continue;

      ctx.save();
      if (g.state === 'frightened') {
        if (powerTimer < 2 && Math.floor(powerTimer * 6) % 2 === 0) {
          ctx.globalAlpha = 0.5;
        } else {
          ctx.filter = 'hue-rotate(180deg) saturate(1.5)';
        }
      } else if (g.state === 'eaten') {
        ctx.globalAlpha = 0.3;
      }

      ctx.drawImage(img, sx - size / 2, sy - size / 2, size, size);
      ctx.restore();
    }

    const px = pac.x * tileSize;
    const py = pac.y * tileSize;
    const psize = tileSize * 0.95;

    ctx.save();
    const glowRadius = psize * 1.2;
    const grad = ctx.createRadialGradient(px, py, psize * 0.2, px, py, glowRadius);
    grad.addColorStop(0, 'rgba(255, 255, 100, 0.65)');
    grad.addColorStop(0.5, 'rgba(255, 220, 0, 0.3)');
    grad.addColorStop(1, 'rgba(255, 200, 0, 0)');
    
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(px, py, glowRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    if (images.pacman) {
      ctx.save();
      if (powered) {
        ctx.shadowColor = '#00ff66';
        ctx.shadowBlur = 12 + Math.sin(frame * 0.3) * 4;
      } else {
        ctx.shadowColor = '#ffff00';
        ctx.shadowBlur = 8;
      }
      ctx.drawImage(images.pacman, px - psize / 2, py - psize / 2, psize, psize);
      ctx.restore();
    }
  }

  function drawCherry(cx, cy, s) {
    ctx.fillStyle = '#e22';
    ctx.beginPath();
    ctx.arc(cx - s * 0.3, cy + s * 0.15, s * 0.38, 0, Math.PI * 2);
    ctx.arc(cx + s * 0.3, cy + s * 0.25, s * 0.38, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#f88';
    ctx.beginPath();
    ctx.arc(cx - s * 0.4, cy + s * 0.05, s * 0.12, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#3a8';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx - s * 0.3, cy - s * 0.15);
    ctx.quadraticCurveTo(cx, cy - s * 0.6, cx + s * 0.3, cy - s * 0.05);
    ctx.stroke();
  }

  function updateUI() {
    document.getElementById('scoreVal').textContent = score;
    const hearts = '♥'.repeat(Math.max(0, lives)) + '♡'.repeat(Math.max(0, 3 - lives));
    document.getElementById('livesVal').textContent = hearts;
  }

  function showGameOver() {
    const ov = document.getElementById('overlay');
    ov.innerHTML = `
      <h1>GAME OVER</h1>
      <p>Final Score: <strong style="color:#ff0">${score}</strong></p>
      <p class="hint">The undead overtook you...</p>
      <button id="restartBtn">PLAY AGAIN</button>
    `;
    ov.style.display = 'flex';
    document.getElementById('restartBtn').addEventListener('click', () => {
      ov.style.display = 'none';
      resetGame();
      gameRunning = true;
      lastTime = performance.now();
      requestAnimationFrame(loop);
    });
  }

  function setDir(name) {
    if (DIRS[name]) pac.nextDir = DIRS[name];
  }

  window.addEventListener('keydown', e => {
    if (!gameRunning) return;
    const k = e.key.toLowerCase();
    if (k === 'arrowup' || k === 'w') { e.preventDefault(); setDir('up'); }
    else if (k === 'arrowdown' || k === 's') { e.preventDefault(); setDir('down'); }
    else if (k === 'arrowleft' || k === 'a') { e.preventDefault(); setDir('left'); }
    else if (k === 'arrowright' || k === 'd') { e.preventDefault(); setDir('right'); }
  });

  function bindDpadButton(id, dirName) {
    const btn = document.getElementById(id);
    if (!btn) return;
    const handler = (e) => {
      e.preventDefault();
      if (gameRunning) setDir(dirName);
    };
    btn.addEventListener('touchstart', handler, { passive: false });
    btn.addEventListener('mousedown', handler);
  }

  function resize() {
    const container = document.getElementById('game-container');
    const controls = document.getElementById('mobile-controls');
    const controlsHeight = controls && window.innerWidth < 768 ? controls.clientHeight + 20 : 0;
    
    const maxW = container.clientWidth - 16;
    const maxH = container.clientHeight - controlsHeight - 50;
    const mapAspect = COLS / ROWS;
    let cw, ch;
    if (maxW / maxH > mapAspect) {
      ch = Math.min(maxH, 640);
      cw = ch * mapAspect;
    } else {
      cw = Math.min(maxW, 700);
      ch = cw / mapAspect;
    }
    tileSize = Math.floor(cw / COLS);
    canvas.width = tileSize * COLS;
    canvas.height = tileSize * ROWS;
    canvas.style.width = canvas.width + 'px';
    canvas.style.height = canvas.height + 'px';
  }

  function loop(now) {
    if (!gameRunning && !gameOver) return;
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    update(dt);
    draw();
    if (gameRunning) requestAnimationFrame(loop);
  }

  function loadImages() {
    return new Promise(resolve => {
      const keys = Object.keys(SPRITES);
      let count = 0;
      keys.forEach(key => {
        const img = new Image();
        img.onload = () => {
          count++;
          if (count === keys.length) resolve();
        };
        img.onerror = () => {
          count++;
          if (count === keys.length) resolve();
        };
        img.src = SPRITES[key];
        images[key] = img;
      });
    });
  }

  async function init() {
    canvas = document.getElementById('game');
    ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    await loadImages();
    buildMap();
    resetPositions();
    resize();
    window.addEventListener('resize', resize);
    updateUI();

    bindDpadButton('btn-up', 'up');
    bindDpadButton('btn-down', 'down');
    bindDpadButton('btn-left', 'left');
    bindDpadButton('btn-right', 'right');

    document.getElementById('startBtn').addEventListener('click', () => {
      document.getElementById('overlay').style.display = 'none';
      resetGame();
      gameRunning = true;
      lastTime = performance.now();
      requestAnimationFrame(loop);
    });

    draw();
  }

  init();
  </script>
</body>
</html>
